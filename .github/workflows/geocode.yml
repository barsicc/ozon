name: Координаты складов (геокодер Яндекса)

on:
  push:
    branches: [darkstores-data]
    paths:
      - data/darkstores.json
      - tools/geocode_yandex.py
      - .github/workflows/geocode.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Найти координаты
        env:
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: python3 tools/geocode_yandex.py

      # Коммит от GITHUB_TOKEN не запускает сборку повторно — зацикливания нет
      - name: Сохранить координаты в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/darkstores.json data/geocode_cache.json data/geocode_report.txt
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -m "Координаты складов (геокодер Яндекса)"
          git push
